<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        .container {
            width: 1600px;
        }
        #filter {
            margin-bottom: 20px;
            color: rgba(127, 190, 161, 0.7);
        }
        #status-filter {
            margin-left: 10px;
            padding: 5px;
            border: 1px solid #549677;
            background: linear-gradient(268deg, rgba(35, 99, 69, 0.33) 24.53%, rgba(7, 41, 50, 0.33) 70%);
            color: #549677;
        }
        #status-filter:hover {
            cursor: pointer;
            background: linear-gradient(268deg, rgba(40, 116, 80, 0.5) 24.53%, rgba(10, 58, 71, 0.5) 70%);
        }
        #pagination {
            margin-top: 10px;
            margin-bottom: 10px;
            text-align: center;
        }
        #pagination a {
            display: inline-block;
            text-decoration: none;
            color: #549677;
            border: 2px solid #549677;
            padding: 5px 10px;
            border-radius: 20px;
        }
        #pagination a:hover {
            background-color: #74c9a1;
            color: white;
            cursor: pointer;
        }
    </style>
    <link rel="stylesheet" href="table.css"/>
</head>
<body>
    <div id="app">
        <h1 id="title">Missions</h1>
        <div id="filter" style="margin-bottom:20px;">
            <label for="status-filter">Filter by Status:</label>
            <select id="status-filter">
                <option value="all">All</option>
                <option value="IN PROGRESS">In Progress</option>
                <option value="COMPLETED">Completed</option>
                <option value="FAILED">Failed</option>
            </select>
        <div class="container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Mission</th>
                        <th>Rover</th>
                        <th style="width:115px">Status</th>
                        <th>Progress</th>
                        <th>Task</th>
                        <th>Parameter</th>
                        <th>Area</th>
                        <th>Duration</th>
                        <th>Update Interval</th>
                        <th>Created At</th>
                        <th>Last Update</th>
                        <th>Last Event</th>
                    </tr>
                </thead>
                <tbody id="table-body"> <!-- js -->
                </tbody>
            </table>
            <div id="pagination"></div>
            <div class="last-update" id="last-update">Last update: --</div>
        </div>
        <a href="index.html"><button class="option">< back</button></a>
    </div>
    
    <script>
        const rowsPerPage = 7;
        let currentPage = 1;
        let missionsData = [];

        function renderRow(mission, value) {
            return `
                <tr>
                    <td>${mission}</td>
                    <td>${value.rover_id ?? ''}</td>
                    <td><span class="state ${getStateClass(value.status)}">${value.status ?? ''}</span></td>
                    <td>${value.progress ?? 0}%</td>
                    <td>${value.mission_type ?? ''}</td>
                    <td>${value.task_param ?? ''}</td>
                    <td>(${(value.area && value.area[0]) || ''}), (${(value.area && value.area[1]) || ''})</td>
                    <td>${value.duration ?? ''}s</td>
                    <td>${value.update_interval ?? ''}s</td>
                    <td>${value.created_at ?? ''}</td>
                    <td>${value.last_update ?? ''}</td>
                    <td>${value.last_event ?? ''}</td>
                </tr>
            `;
        }

        function displayTable(page = 1) {
            currentPage = page;
            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = startIndex + rowsPerPage;
            const slice = missionsData.slice(startIndex, endIndex);

            const tbody = document.getElementById("table-body");
            if (!tbody) return;

            if (slice.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;color:#74c9a1">No missions</td></tr>';
            } else {
                tbody.innerHTML = slice.map(([m, v]) => renderRow(m, v)).join('');
            }

            updateTimestamp();
            updatePagination(currentPage);
        }

        function updatePagination(currentPage) {
            const pageCount = Math.max(1, Math.ceil(missionsData.length / rowsPerPage));
            const paginationContainer = document.getElementById("pagination");
            if (!paginationContainer) return;
            paginationContainer.innerHTML = "";

            for (let i = 1; i <= pageCount; i++) {
                const pageLink = document.createElement("a");
                pageLink.href = "#";
                pageLink.innerText = i;
                pageLink.onclick = (e) => {
                    e.preventDefault();
                    displayTable(i);
                };
                if (i === currentPage) {
                    pageLink.style.fontWeight = "bold";
                }
                paginationContainer.appendChild(pageLink);
                paginationContainer.appendChild(document.createTextNode(" "));
            }
        }
        
        function getStateClass(state) {
            const stateMap = {
                'IN PROGRESS': 'state-active',
                'COMPLETED': 'state-idle',
                'FAILED': 'state-error'
            };
            return stateMap[state] || 'state-idle';
        }

        function updateTimestamp() {
            const now = new Date();
            const el = document.getElementById('last-update');
            if (el) {
                el.textContent = `Last update: ${now.toLocaleTimeString('pt-PT')}`;
            }
        }

        async function loadMissions(bool =false) {
            try {
                const response = await fetch('http://10.0.12.20:5000/missions');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const missions = await response.json();

                const entries = Object.entries(missions || {});
                const filter = (document.getElementById('status-filter')?.value || 'all').toLowerCase();
                missionsData = entries.filter(([id, v]) => {
                    if (filter === 'all') return true;
                    return ((v.status || '').toLowerCase() === filter);
                });

                if (bool) currentPage = 1; // reset to first page on filter change
                displayTable(currentPage);
            } catch (error) {
                const tbody = document.getElementById('table-body');
                if (tbody) tbody.innerHTML =
                    '<tr><td colspan="12" style="text-align: center; color: #F44336;">Error loading missions</td></tr>';
                console.error('loadMissions error', error);
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const statusSelect = document.getElementById('status-filter');
            if (statusSelect) statusSelect.addEventListener('change', () => loadMissions(true));
            loadMissions();
            setInterval(loadMissions, 5000);
        });
    </script>
</body>
</html>
