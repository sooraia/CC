<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            width: 800px;
        }
    </style>
    <link rel="stylesheet" href="table.css"/>
</head>
<body>
    <div id="app">
        <h1 id="title">Active Rovers</h1>
        <div class="container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Rover</th>
                        <th>State</th>
                    </tr>
                </thead>
                <tbody id="table-body"> <!-- js -->
                </tbody>
            </table>
            <div class="last-update" id="last-update">Last update: --</div>
        </div>
        <a href="index.html"><button class="option">< back</button></a>
    </div>
    
    <script>
        function getStateClass(state) {
            const stateMap = {
                'IDLE': 'state-idle',
                'ACTIVE': 'state-active', 
                'ON_THE_WAY': 'state-on_the_way',
                'ERROR': 'state-error'
            };
            return stateMap[state] || 'state-idle';
        }

        function updateTimestamp() {
            const now = new Date();
            const el = document.getElementById('last-update');
            if (el) {
                el.textContent = `Last update: ${now.toLocaleTimeString('pt-PT')}`;
            }
        }

        async function loadRovers() {
            try {
                const response = await fetch('http://10.0.12.20:5000/rovers/active');
                const rovers = await response.json();
                const tbody = document.getElementById('table-body');
                
                if (!rovers || Object.keys(rovers).length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; color: #74c9a1;">No active rovers</td></tr>';
                    return;
                }
                
                let html = '';
                for (const [rover, state] of Object.entries(rovers)) {
                    html += `
                        <tr>
                            <td>${rover}</td>
                            <td><span class="state ${getStateClass(state)}">${state}</span></td>
                        </tr>
                    `;
                }
                tbody.innerHTML = html;
                updateTimestamp();
            } catch (error) {
                document.getElementById('table-body').innerHTML = 
                    '<tr><td colspan="2" style="text-align: center; color: #F44336;">Error loading rovers</td></tr>';
                console.error('Error fetching rovers:', error);
            }
        }
        
        loadRovers(); //inicio
        setInterval(loadRovers, 5000); //updates
    </script>
</body>
</html>
